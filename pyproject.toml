[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsigs"
version = "1.0.0"
description = "The open detection-signature library for AI-agent threats — prompt injection, jailbreaks, tool poisoning, exfiltration, obfuscation. Mapped to MITRE ATLAS + OWASP LLM Top 10. nuclei-templates, for AI agents."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["ai-security","prompt-injection","jailbreak","llm-security","mcp","agent-security","mitre-atlas","owasp-llm","detection","signatures","security"]
classifiers = ["Development Status :: 5 - Production/Stable","Environment :: Console","License :: Other/Proprietary License","Programming Language :: Python :: 3.10","Programming Language :: Python :: 3.11","Programming Language :: Python :: 3.12","Topic :: Security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/agentsigs"
Documentation = "https://github.com/cognis-digital/agentsigs/tree/main/docs"
Discussions = "https://github.com/cognis-digital/agentsigs/discussions"

[project.scripts]
agentsigs = "agentsigs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentsigs"]
artifacts = ["agentsigs/signatures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
